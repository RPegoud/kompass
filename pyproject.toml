[project]
name = "kompass"
version = "0.1.0"
description = "Test, benchmark, tune and profile GPU kernels (CUDA, Triton, PyTorch) side by side, locally or on Modal."
readme = "README.md"
authors = [
    { name = "Ryan Pégoud", email = "ryan.pegoud@outlook.com" }
]
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "hydra-core>=1.3.5",
    "ipykernel>=7.3.0",
    "modal>=1.5.4",
    "nbformat>=5.11.1",
    "ncu-report>=2026.2.0",
    "ninja>=1.13.2",
    "numpy>=2.5.2",
    "pandas>=3.0.6",
    "polars>=2.0.0",
    "pypdf>=6.21.1",
    "rich>=15.0.0",
    "tabulate>=0.10.0",
    "torch>=2.13.0",
    "tqdm>=4.70.1",
    "triton>=3.7.1",
    "typer>=0.27.2",
    "xy>=0.0.8",
]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=8.4",
    "ruff>=0.14",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"
pythonVersion = "3.12"
reportMissingTypeStubs = false
extraPaths = ["."]

[project.scripts]
kompass = "kompass.cli.main:app"
